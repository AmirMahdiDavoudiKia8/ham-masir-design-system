<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کتابخانه هم مسیر — جمع‌بندی شیمی کنکور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#5B9E94; --peach:#E8B99A; --cream:#FAF7F2; --ink:#22403B;
  --ink-2:rgba(34,64,59,.72); --ink-3:rgba(34,64,59,.5);
  --line:rgba(34,64,59,.12); --card:#FFFDFA;
  --peach-tint:rgba(232,185,154,.14);
  --r:18px; --maxw:900px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Vazirmatn,"IRANSans","Segoe UI",Tahoma,sans-serif;
  background:
    radial-gradient(1200px 500px at 90% -10%, var(--peach-tint), transparent 60%),
    var(--cream);
  color:var(--ink); line-height:2; font-size:15px; font-weight:400;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px 90px}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(to bottom, var(--cream) 72%, rgba(250,247,242,.85));
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
}
.hbar{max-width:var(--maxw);margin:0 auto;padding:14px 18px 12px}
.brandline{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;flex:none}
.brand{font-weight:700;font-size:15px;letter-spacing:-.2px}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);line-height:1.6}
.searchrow{display:flex;gap:8px;margin-top:12px}
.search{
  flex:1;display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--line); border-radius:14px; padding:9px 13px;
  transition:border-color .2s, box-shadow .2s;
}
.search:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(91,158,148,.13)}
.search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:14.5px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search svg{flex:none;opacity:.5}
.clearbtn{border:0;background:transparent;color:var(--ink-3);font-size:18px;line-height:1;padding:0 2px;display:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line);background:transparent;border-radius:999px;
  padding:4px 12px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;transition:.18s;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.chip.t[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}

/* ---------- hero / path ---------- */
.hero{padding:26px 0 6px}
.hero h1{font-size:23px;line-height:1.65;margin:0 0 8px;font-weight:700;letter-spacing:-.3px}
.hero p{margin:0;color:var(--ink-2);font-size:14px;max-width:52ch}
.stats{display:flex;gap:18px;margin-top:16px;font-size:12.5px;color:var(--ink-3)}
.stats b{display:block;font-size:19px;color:var(--ink);font-weight:700;line-height:1.4}

/* the signature: two parallel lines = the accompanied path */
.path{position:relative;margin:26px 0 10px;padding-right:26px}
.path::before,.path::after{
  content:"";position:absolute;top:6px;bottom:6px;width:2px;border-radius:2px;
}
.path::before{right:6px;background:linear-gradient(var(--teal),rgba(91,158,148,.15))}
.path::after{right:12px;background:linear-gradient(var(--peach),rgba(232,185,154,.15))}
.grade{margin-bottom:6px}
.grade > h2{
  font-size:12.5px;font-weight:500;color:var(--ink-3);margin:16px 0 8px;
  letter-spacing:.3px;position:relative;
}
.grade > h2::before{
  content:"";position:absolute;right:-24px;top:50%;width:9px;height:9px;margin-top:-4.5px;
  border-radius:50%;background:var(--cream);border:2px solid var(--teal);
}
.chlist{display:flex;flex-direction:column;gap:7px}
.chbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:right;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:11px 14px;transition:.18s;
}
.chbtn:hover{border-color:var(--teal);transform:translateX(-2px)}
.chbtn .no{
  flex:none;width:24px;height:24px;border-radius:8px;background:var(--peach-tint);
  color:var(--ink-2);font-size:12px;display:grid;place-items:center;font-weight:500;
}
.chbtn .ttl{flex:1;font-size:14px;font-weight:500}
.chbtn .cnt{font-size:11.5px;color:var(--ink-3)}

/* ---------- chapter view ---------- */
.back{background:transparent;border:0;color:var(--ink-2);font-size:13px;padding:16px 0 4px;display:flex;align-items:center;gap:6px}
.chhead{padding:4px 0 6px;border-bottom:1px solid var(--line);margin-bottom:6px}
.eyebrow{font-size:12px;color:var(--teal);font-weight:500}
.chhead h1{font-size:21px;margin:6px 0 10px;line-height:1.6;font-weight:700}
.intro{
  background:var(--card);border:1px solid var(--line);border-right:3px solid var(--peach);
  border-radius:14px;padding:13px 15px;font-size:13.5px;color:var(--ink-2);margin:0 0 20px;
}
.intro b{color:var(--ink);font-weight:500}
.sec{margin:26px 0 0}
.sec > h3{
  font-size:15px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:9px;
}
.sec > h3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal);flex:none}
.seccnt{font-size:11.5px;color:var(--ink-3);font-weight:400}
.notes{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.note{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px;transition:.18s;
}
.note.done{opacity:.55}
.note p{margin:0;font-size:14px;line-height:2.05}
.note mark{background:rgba(232,185,154,.5);color:inherit;border-radius:4px;padding:0 2px}
.meta{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3)}
.tag.mafhoomi{color:var(--teal);border-color:rgba(91,158,148,.35)}
.tag.hefzi{color:#b07b4f;border-color:rgba(232,185,154,.6)}
.tag.mohasebati{color:var(--ink);border-color:rgba(34,64,59,.3)}
.pg{font-size:11px;color:var(--ink-3);margin-inline-start:auto}
.mark-btn{
  border:1px solid var(--line);background:transparent;border-radius:999px;
  font-size:11.5px;padding:2px 10px;color:var(--ink-3);
}
.mark-btn[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.figure{
  display:block;margin-top:8px;font-size:11.5px;color:var(--ink-3);
  border-top:1px dashed var(--line);padding-top:7px;
}

/* ---------- results ---------- */
.rescount{font-size:12.5px;color:var(--ink-3);padding:16px 0 2px}
.crumb{font-size:11.5px;color:var(--ink-3);margin-bottom:6px}
.crumb b{color:var(--teal);font-weight:500}
.empty{text-align:center;padding:60px 20px;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.progressbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:10px}
.progressbar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
footer{padding:34px 0 0;color:var(--ink-3);font-size:12px;text-align:center;border-top:1px solid var(--line);margin-top:40px}
@media(min-width:860px){
  body{font-size:15.5px}
  .hero h1{font-size:28px}
  .chlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<header>
  <div class="hbar">
    <div class="brandline">
      <svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M8 33c0-13 5-22 16-27" stroke="#5B9E94" stroke-width="3" stroke-linecap="round"/>

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="دنبال چی می‌گردی؟ مثلاً «اوزون»، «آنتالپی»، «فصل ۲ دهم»" autocomplete="off">

<main class="wrap" id="app"></main>

<footer>
  محتوا از کتاب «جمع‌بندی شیمی کنکور» استخراج و بازنویسی شده است؛ شکل‌ها و فرمول‌ها در فایل اصلی هستند.<br>

فلزها الکترون می‌گیرند یک نمونه طبیعی از این عنصر شامل دو ایزوتوپ می‌شود در دمای اتاق به حالت گاز بوده و به رنگ زرد دیده می‌شود خاصیت رنگ بری و گندزدایی دارد در شرایط اتاق به شکل مولکول‌های دواتمی دیده می‌شود در مقایسه با سایر نافلزهای موجود در تناوب سوم واکنش پذیری بیشتری دارد در واکنش با هیدروژن، یک اسید قوی را تولید می‌کند آنیون حاصل از آن فراوان ترین آنیون موجود در آب دریا است آنیون تک اتمی حاصل از آن به آرایش الکترونی آرگون می‌رسد در سمت آند سلول مربوط به برقکافت سدیم کلرید مذاب تولید می‌شود در دمای اتاق به آرامی با گاز هیدروژن واکنش می‌دهد (در حضور کاتالیزگر آهن III کلرید با گاز اتن واکنش می‌دهد ترکیب‌های حاوی آن را برای بخاطر خاصیت میکروب کشی به صابون اضافه می‌کنند فلوئور، اولین عضو از گروه ویژگی‌های مهم عنصر برم نیز به شرح نمودار زیر هستند: ویژگی‌های مهم عنصر ید نیز به شرح زیر هستند: در ساختار مواد مولکولی، میان شمار معینی از اتم‌ها پیوند اشتراکی وجود دارد و نیروی بین مولکول‌ها از نوع وان دروالسی و یا هیدروژنی است. برای ذوب کردن این مواد، باید به نیروهای ضعیف بین مولکولی در آن‌ها غلبه کنیم و به همین دلیل، چنین موادی دمای ذوب پایینی دارند. گرافیت، دگرشکلی از کربن به شمار می‌رود. در قرن شانزدهم میلادی، قطعه ی بزرگی از گرافیت خالص کشف شد که بسیار نرم بود. به دلیل شکل ظاهری گرافیت، مردم در آن زمان می‌پنداشتند که گرافیت از سرب تشکیل شده است. توجه داریم که گرافیت، نوعی ماده کووالانسی است. مواد کووالانسی شامل شمار بسیار زیادی از اتم‌ها می‌شوند که توسط پیوندهای اشتراکی به یکدیگر متصل شده اند. از آن جا که این مواد در دما و فشار اتاق به حالت جامد هستند، آن‌ها را با نام جامدهای کووالانسی نیز می‌خوانند.","page":18,"type":"محاسباتی","hasFormula":false,"keywords":["آرایش الکترون","اتم","ایزوتوپ","تناوب","جدول دوره","فلز"]},{"text":"ویژگی‌های مهم عنصر برم نیز به شرح نمودار زیر هستند:","page":19,"type":"مفهومی","hasFormula":false,"keywords":[]},{"text":"ویژگی‌های مهم عنصر ید نیز به شرح زیر هستند:","page":19,"type":"مفهومی","hasFormula":false,"keywords":[]},{"text":"گرافیت،دگرشکلی از کربن به شمار می‌رود. در قرن شانزدهم میلادی،قطعه یبزرگی از گرافیت خالص کشف شد که بسیار نرم بو ، گاز کربن دیاکسید به شمار می‌رود.","page":22,"type":"مفهومی","hasFormula":false,"keywords":["بخار آب","هوای پاک"]},{"text":"بررسیهای دانشمندان در مورد هوای به دام افتاده در بلورهای یخ در یخچالهای قطبی و نیز سنگهای آتشفشانی نشان می‌دهد که از 200 میلیون سال پیش تاکنون، نسبت گازهای سازنده هواکره(درصد حجمی گازهای موجود در هواکره) تقریبا ثابت مانده است.","page":22,"type":"مفهومی","hasFormula":false,"keywords":["درصد حجمی","هواکره"]},{"text":"از فرایند تقطیر، برای جداسازی اجزای هواکره استفاده می‌شود. روش تقطیر جزءبهجز ءهوای مایع را می‌توان در چند مرحله، به صورت زیر نشان داد:","page":22,"type":"مفهومی","hasFormula":false,"keywords":["هواکره"]},{"text":"در مرحله آخر فرایند تقطیر،شروع به افزایش دمای هوای مایع می‌کنند و هر ماده‌ای که به نقطهی جوش خودش برسد، تبدیل به گاز(تبخیر) شده و از مخلوط جدا می‌شود. این فرایند، مشابه به فرایند انجام شده برای تقطیر نفت خام است.","page":22,"type":"مفهومی","hasFormula":false,"keywords":[]},{"text":"ترتیب جدا شده‌اند گازها در مراحل افزایش دمای یک نمونه از هوای مایع با به صورت: نیتروژن← آرگون ← اکسیژن است.","page":22,"type":"مفهومی","hasFormula":true,"keywords":["آرگون","نیتروژن"]},{"text":"تهیه اکسیژن خالص در روش تقطیر جزبهجز هوای مایع سخت است،چون نقطه جوش این ماده به نقطه جوش آرگون نزدیک است. البته، در فرایند تقطیر، آرگون را با درصد خلوص بالا می‌توان تهیه کرد.","page":22,"type":"مفهومی","hasFormula":false,"keywords":["آرگون"]},{"text":"آرگون گازی بی‌رنگ، بی‌بو و غیرسمی است. واژه آرگون به معنای تنبل است؛ زیرا این گاز واکنشپذیری ناچیزی دارد. این گاز در پتروشیمی شیراز از تقطیر جزءبهجزءِ هوای مایع با خلوص بسیار زیاد تهیه می‌شود.همانطور که قبلا گفتیم، آرگون به عنوان محیط بی‌اثر در جوشکاری به کار می‌رود.","page":22,"type":"حفظی","hasFormula":false,"keywords":["آرگون"]},{"text":"مقدار گازهای نجیب مانند هلیم، آرگون، کریپتون و زنون در هواکره بسیار کم است. از این رو، این مواد به گازهای کمیاب نیز معروف هستند.","page":22,"type":"حفظی","hasFormula":false,"keywords":["آرگون","هواکره"]},{"text":"هلیمHe)2 در کره زمین به مقدار خیلی کم یافت می‌شود؛ به طوری که مقدار ناچیزی از آن در هوا و مقدار بیشتری از آن در لایههای زیرین پوسته زمین وجود دارد.به همین خاطر،منابع زمینی هلیم از هواکره سرشارتر بوده و برای تولید هلیم در مقیاس صنعتی مناسبتر هستند.","page":22,"type":"مفهومی","hasFormula":false,"keywords":["هواکره"]},{"text":"هلیم از واکنشهای هسته‌ای در ژرفای زمین تولید می‌شود. این گاز پس از نفوذ به لایههای زمین، وارد میدانهای گازی می‌شود. حدود 7 درصد حجمی از مخلوط گاز طبیعی را هلیم تشکیل می‌دهد. البته توجه داریم که مقدار هلیم در میدانهای گازی گوناگون، متفاوت است.","page":22,"type":"مفهومی","hasFormula":false,"keywords":["درصد حجمی"]},{"text":"چون درصد حجمی هلیم در هواکره کمتر از منابع زمینی آن است، پس بدست آوردن هلیم از طریق تقطیر هوا مقرون به صرفه نیست. البته، جداسازی هلیم از گاز طبیعی به دانش و فناوری پیشرفتهای نیاز دارد. متخصصان کشورمان تاکنون موفق به جداسازی و تهیه آن نشدهاند و همچنان، هلیم از دیگر کشورها وارد می‌شود. تا اینجا، مطالب کلی درباره گازهای سازنده هواکره را خواندیم! از این به بعد، میریم سراغ ویژگیهای جزئی یکی از عناصر مهم موجود در هواکره، یعنی اکسیژن...","page":22,"type":"مفهومی","hasFormula":false,"keywords":["درصد حجمی","هواکره"]},{"text":"اتماکسیژن در ساختار همه مولکولهای زیستی مانند کربوهیدراتها، چربیها و پروتئینها یافت می‌شود. این گاز در هواکره نیز به طوره عمده به شکل مولکولهای دو اتمی O2 وجود دارد. هرچه از سطح زمین فاصله میگیریم، فشار گاز اکسیژن کمتر می‌شود.","page":22,"type":"محاسباتی","hasFormula":false,"keywords":["فشار","مول","هواکره"]},{"text":"کره زمین با لایه‌ای از گازها به نام هواکره احاطه شده است. این لایه برای زمین همانند لایه پلاستیکی برای گلخانه است و سبب گرم شده‌اند کره زمین می‌شود، به طوری که اگر این لایه وجود نداشت، کره زمین سرد شده و میانگین دمای آن به کاهش مییافت.","page":27,"type":"حفظی","hasFormula":true,"keywords":["هواکره","گلخانه"]},{"text":"پرتوهای خورشیدی پس از برخورد به زمین،دوباره با طول موجهای بلندتر به هواکره برمیگردند، اما برخی گازهای موجود در هواکره مانند CO2 و HO2 و... مانع خروج آنها می‌شوند و بدهید ترتیب زمین را گرمتر می‌کنند.","page":27,"type":"مفهومی","hasFormula":false," تی معدنی جهان به شمار می‌رود و بزرگترین تولیدکنند همس ایران است. برای تهی ه مس خام از سنگ معدن آن، واکنش Cu S(s) O (g) Cu(s) SO 22 در این معدن انجام می‌شود.","page":51,"type":"مفهومی","hasFormula":true,"keywords":["سنگ معدن","مس","معدن"]},{"text":"برای شناسایی نوع یون فلزی موجود در یک سنگ معدن، ابتدا این یون فلزی را به حالت محلول(aq)درمی آوریم و پس از آن، با مخلوط کردن این محلول با یک محلول معین، به کمک رنگ رسوب ایجاد شده،نوع کاتیون موجود در محلول اول را شناسایی می‌کنیم.","page":51,"type":"حفظی","hasFormula":false,"keywords":["سنگ معدن","فلز","معدن"]},{"text":"آهن در طبیعت به شکل دو اکسید متفاوت وجود دارد. برای شناسایی نوع کاتیون موجود در نوعی از اکسید آهن، از واکنش‌های زیر مطابق مراحل داده شده استفاده می‌کنیم: آهن فراوان ترین عنصر فلزی موجود در سیاره زمین است در روند تشکیل عناصر، با استفاده از عناصر سبک مثل لیتیم و کربن تولید شده است این عنصر دارای چند ایزوتوپ طبیعی مختلف است (در طبیعت به شکل دو نوع اکسید آهنII(اکسید و آهنIII اکسید یافت می‌شود گرد آن با ایجاد یک شعله نارنجی رنگ می‌سوزد به عنوان کاتالیزگر در فرایند هابر شرکت می‌کند کاتیون حاصل از آن در آب آشامیدنی یافت می‌شود فلزی محکم بوده و آن برای ساخت در و پنجره فلزی استفاده می‌شود فلزی است که در سطح جهان بیشترین مصرف سالانه را در بین صنایع گوناگون دارد در شرکت‌های فولاد، از کربن برای استخراج این عنصر از سنگ معدن استفاده می‌شود در واکنش ترمیت به عنوان فراورده تولید می‌شود از آهن مذاب حاصل از واکنش ترمیت برای جوش دادن خطوط راه آهن استفاده می‌شود کلوخه‌ها و پوسته‌های غنی از این عنصر در کف اقیانوس‌ها یافت می‌شود اسفناج و عدسی از غذاهای محتوی این عنصر هستند واکش خوردگی این فلز در طبیعت با سرعت کمی انجام می‌شود از فلز منیزیم برای جلوگیری از خوردگی این فلز در صنعت نفت استفاده می‌شود به همراه سایر فلزها، در ساختار ورقه‌های گالوانیزه و حلبی وجود دارد درصد از آهن تولید شده برای قطعات خورده شده مصرف می‌شود سرعت واکنش خوردگی این فلز در محیط اسیدی نسبت به محیط خنثی سریع تر انجام می‌شود آهن در طبیعت به شکل دو اکسید متفاوت وجود دارد. برای شناسایی نوع کاتیون موجود در نوعی‌های مقابل مطابق مراحل از اکسید آهن، از واکنش کنیم: داده شده استفاده می‌ها منبعی غنی از منابع فلزی بستر اقیانوس به دلیل نیاز روزافزون جهان به گوناگون است. منابع شیمیایی و کاهش میزان این منابع در‌ها در جستوجوی این منایع دان کره، شیمی سنگ‌ها هستند. در اقیانوس‌هایی غنی از‌ها و پوسته‌ها نیز موادی به صورت کلوخه‌ها در برخی مناطق، محتوی سولفید چندین فلز واسطه بوده و در برخی از مناطق آن اقیانوس شوند. فلزهایی مانند منگنز، کبالت، آهن، نیکل و مس یافت می‌شود بینی می‌پیش دهد. برداری از منابع اقیانوسی را نوید می‌ها، بهره‌های فلزی موجود در کف اقیانوس در مقایسه با ذخایر زمینی آن غلظت بیشتر گونه برداری از منابع شیمیایی بستر دریا، به یکی از صنایع کلیدی و تاثیرگذار در روابط کشورها تبدیل شود. اکتشاف و بهره بحث بازده درصدی و درصد خلوص، هرچند که اغلب به صورت مساله در کنکور مطرح می‌شوند اما مفاهیم تئوریک مهمی هم دارن که حتما باید آن‌ها را بلد باشید... ها ناخالص باشند یا واکنش به طور کامل انجام واکنش دهنده روند، زیرا ممکن است رود به پیش نمی‌های شیمیایی همیشه مطابق آنچه انتظار می‌واکنش‌های تولید شده (مقدار عملی) فراورده شود. با این توصیف مقدار واقعی‌های ناخواسته دیگری انجام زمان با آن واکنش، واکنش هم نشود و یا حتی گاهی کمتر است. های شیمیایی از صد درصد از مقدار مورد انتظار (مقدار نظری) کمتر است. در واقع بازده درصدی واکنش شود: ها با توجه به مقدار عملی و نظری فراورده تولید شده، از رابطه زیر استفاده می‌برای محاسبه بازده درصدی واکنش‌های مصرف شده ناخالص هستند. در واقع علاوه بر ماده اصلی مورد نیاز ما، مقداری ناخالصی نیز در نمونه دهنده در صنعت و آزمایشگاه اغلب واکنش شود: زیر محاسبه می‌شود. درصد خلوص یک ماده از رابطه شود. برای بیان میزان خالص بودن یک ماده از درصد خلوص استفاده می‌مورد نظر یافت می‌منظور از جرم ماده ناخالص در این رابطه، جرم کل ماده مصرف شده است که مقدار آن برابر با مجموع جرم ماده خالص و جرم ناخالصی موجود در نمونه ای برابر با خواهد بود. توجه داریم که اگر درصد خلوص ماده از جرم ماده خالص است. زیست محیطی را در اجتماعی اقتصادیها و ملاحظات بر اساس اصول توسعه پایدار، باید در تولید یک ماده یا عرضه خدمات، همه هزینه‌ها کمترین مقدار ممکن باشد، در آن صورت در برداری از یک معدن با در نظر گرفتن این ملاحظه‌های بهره نظر گرفت، به طوری که اگر مجموع هزینه کنیم. مسیر پیشرفت پایدار حرکت می‌شود. در استخراج شود. طی این فرایند، باقیمانده سنگ معدن به مواد دیگر تبدیل‌ها، تنها درصد کمی از سنگ معدن به فلز تبدیل می‌در استخراج فلزها از سنگ معدن آن گیرد. شده و اغلب مورد استفاده قرار نمی‌ها به طبیعت به شکل سنگ معدن فلزها از جمله منابع تجدیدناپذیر هستند. در حال حاضر، آهنگ مصرف و استخراج فلزها بیشتر از آهنگ بازگشت آن توان گفت میزان ذخایر فلزی موجود در جهان در حال کاهش یافتن است. است. بر این اساس، می‌شود و به توسعه پایدار کشورها نیز کمک دهد، سبب کاهش سرعت گرمایش جهانی می‌اکسید را کاهش می‌بازیافت فلزها از جمله آهن، ردپای کربن دی ی فلزها در جهان امروز را کند. تصویر زیر، نمایی از چرخه می‌دهد: نشان می‌شود که می‌توان یک لامپ از بازگردانی هفت قوطی فولادی آنقدر انرژی ذخیره می‌تا اینجا، داشتیم در رابطه با شیمی معدنی صحبت می‌کردیم. از این به بعد، میریم سراغ مباحث پایه ای و مهم شیمی آلی... شود ای متمایل به سبز از دل زمین بیرون کشیده می‌های فسیلی است که به شکل مایع غلیظ سیاه رنگ یا قهوه نفت، یکی از سوخت‌ها، حل مشکل حمل و نقل از‌هایی با هدف یافتن کاربردهای جدید و مناسب برای مواد موجود در نفت خام انجام شده است. نتیجه این پژوهش پژوهش‌های گوناگون بوده است. شهری به شهر دیگر یا از کشوری به کشور دیگر و ساخت داروهای تازه برای درمان بیماری کند. نقش نخست آن، به عنوان منبع تامین انرژی بوده و در نقش دوم، ماده اولیه برای تهیه بسیاری نفت خام در دنیای کنونی دو نقش اساسی ایفا می‌شود. ها استفاده می‌از مواد و کالاهایی است که در صنایع گوناگون از آن در این کادر به بررسی برخی از ویژگی‌های طلای سیاه(نفت خام) میپردازیم: حدود نیمی از نفتی که از چاه‌های نفت بیرون کشیده می‌شود، به عنوان سوخت در وسایل نقلیه استفاده می‌شود. بخش اعظم نیم دیگر آن نیز برای تامین گرما و انرژی الکتریکی مورد نیاز ما به کار می‌رود. کمتر از ده درصد از نفت خام مصرفی در دنیا برای تولید الیاف و پارچه، شوینده‌ها، مواد آرایشی و بهداشتی، رنگ، پلاستیک، مواد منفجره و لاستیک به کار می‌رود. به طور کلی، موارد استفاده از نفت به این شکل تقسیم بندی می‌شوند: کمتر از - حدود - حدود با توجه به توضیحات بالا، می‌توان گفت مجموعا بیش از بشکه نفت خام در دنیا به شکل‌های گوناگون مصرف می‌شود. هر بشکه نفت خام، هم ارز با 78 رو ایندی که باعث کاهش دما و خنک شده‌اند آب درون کوزه خواهد شد.ساختار یخچال صحرایی به صورت زیر است:","page":63,"type":"مفهومی","hasFormula":false,"keywords":["دما"]},{"text":"جدول زیر، سرعت واکنش برخی از مواد مختلف را نشان می‌دهد: نوع واکنش سرعت واکنش انفجار، واکنشی است که در آن از مقدار کمی ماده منفجره به حالت جامد یا مایع، حجم زیادی از گازهای داغ تولید می‌شود. بسیار سریع افزودن محلول سدیم کلرید به محلول نقره نیترات باعث تشکیل رسوب سفیدرنگ نقره کلرید می‌شود. سریع اشیای آهنی در هوای مرطوب زنگ می‌زنند. زنگار تولید شده در این واکنش ترد و شکننده است و فرو می‌ریزد. کند بسیاری از کتاب‌های قدیمی در گذر زمان زرد و پوسیده می‌شود. این پدیده را واکنش تجزیه سلولز کاغذ می‌نامیم. بسیار کند واکنش محلول بنفش رنگ پتاسیم پرمنگنات با یک اسید آلی در دمای اتاق که منجر به بی رنگ شده‌اند محلول می‌شود. کند واکنش محلول بنفش رنگ پتاسیم پرمنگنات با اسید آلی در دمای بالا که منجر به بی رنگ شده‌اند سریع تر محلول می‌شود. سریع تجزیه محلول هیدروژن پراکسید(آب اکسیژنه) در دمای اتاق و تبدیل آن به گاز اکسیژن و آب. کند","page":69,"type":"حفظی","hasFormula":false,"keywords":["انفجار","دما","سرعت واکنش"]},{"text":"بررسی‌ها نشان می‌دهد که زمان انجام واکنش‌ها به عوامل گوناگونی وابسته است؛به گونه ای که برای کاهش یا افزایش سرعت انجام واکنش‌ها می‌توان عواملی مانند دما، غلظت، نوع مواد واکنش دهنده، کاتالیزگر و سطح تماس واکنش دهنده‌ها را تغییر داد.","page":69,"type":"مفهومی","hasFormula":false,"keywords":["دما","سطح تماس","غلظت","کاتالیزگر"]},{"text":"افزایش مقدار واکنش دهنده‌ها و افزایش سطح تماس میان آن‌ها می‌توان دسرعت انجام شده‌اند واکنش‌های مختلف را افزایش دهد.","page":69,"type":"مفهومی","hasFormula":false,"keywords":["سطح تماس"]},{"text":"واکنش سوختن قند، در صورت آغشته کردن سطح این ماده به مقداری از خاک باغچه، سریع تر انجام می‌شود؛ زیرا در خاک باغچه کاتالیزگر مناسب برای این واکنش وجود دارد.","page":69,"type":"مفهومی","hasFormula":false,"keywords":["کاتالیزگر"]},{"text":"فلزهای قلیایی سدیم و پتاسیم در شرایط یکسان با آب سرد به شدت واکنش می‌دهند، اما به دلیل تفاوت خاصیت فلزی این عناصر، سرعت واکنش‌های انجام شده متفاوت است.توجه داریم که فلز پتاسیم در مقایسه با فلز سدیم واکنش پذیری بیشتری دارد. نمودار زیر، ویژگی‌های مهم فلز پتاسیم را به طور خلاصه نشان می‌دهد:","page":69,"type":"مفهومی","hasFormula":false,"keywords":["سرعت واکنش"]},{"text":"محلول آبی بنفش رنگ پتاسیم پرمنگنات با یک اسید آلی(مثل استیک اسید،بوتانوئیک اسید، فورمیک اسید و بنزوئیک اسید) در دمای اتاق به کندی واکنش می‌دهد اما با گرم شده‌اند، محلول با سرعت بیشتری بی رنگ می‌شود.این مثال اثر دما را در واکنش انجام شده‌اند این واکنش در حضور شعله آتش و در عدم حضور شعله آتش را نشان می‌دهد:","page":69,"type":"حفظی","hasFormula":false,"keywords":["دما"]},{"text":"توجه داریمکه افزایش دما هم سرعت واکنش‌های گرماگیر و گرماده را افزایش می‌دهد. پتاسیم سومین عضو از خانواده فلزهای قلیایی است کاتیون حاصل از آن یکی از مهم ترین یون‌ها در مایعات بدن است نیاز روزانه بدن هر فرد به کاتیون این عنصر، دو برابر یون سدیم است برخی از کودهای محتوی این عنصر به خاک افزوده می‌شوند از سامانه واکنش این فلز با گاز کلر نور ارغوانی گسیل می‌شود این فلز با آب سرد به شدت واکنش می‌دهد کاتیون آن در ساختار برخی از صابون‌های مایع وجود دارد این عنصر به سرعت با آب واکنش داده و پتاسیم هیدروکسید تولید می‌کند آلی (مثل استیک اسید، بوتانوئیک اسید، فورمیک اسید و رنگ پتاسیم پرمنگنات با یک اسید محلول آبی بنفش شود. رنگ می‌دهد اما با گرم شده‌اند، محلول با سرعت بیشتری بی بنزوئیک اسید) در دمای اتاق به کندی واکنش می‌دهد. تصویر مقابل، نمایی از انجام شده‌اند این واکنش در حضور شعله پذیری نشان می‌این مثال اثر دما را در واکنش دهد: آتش و در عدم حضور شعله آتش را نشان می‌دهد. های گرماده را افزایش می‌های گرماگیر و هم سرعت واکنش توجه داریم که افزایش دما هم سرعت واکنش سوزد، در حالی که همان مقدار الیاف آهن داغ و سرخ شده در یک ارلن پر از اکسیژن به دلیل افزایش غلظت گاز الیاف آهنی داغ و سرخ شده در هوا نمی‌سوزد. اکسیژن در محیط واکنش می‌سوزاند، در حالی که پاشیدن کند اما آن را نمی‌آتش، گردِ آهن موجود در کپسول چینی را داغ و سرخ می‌شعله شود؛ زیرا این فرایند باعث افزایش سطح تماس گرد و پخش کردن گردِ آهن بر روی شعله، سبب سوختن آن می‌دهد: شود. تصویر مقابل، نمایی از این فرایند را نشان می‌آهن با شعله می‌کند، در حالی که افزودن دو قطره از محلول پتاسیم یدید، سرعت محلول هیدروژن پراکسید در دمای اتاق به کندی تجزیه شده و گاز اکسیژن تولید می‌شود. توجه داریم که این دهد. در این فرایند، یون یدید با اثر کاتالیزگری، موجب افزایش سرعت واکنش می‌واکنش را به طور چشمگیری افزایش می‌کاتالیزگر تاثیری در مقدار نهایی فراورده تولید شده در واکنش ندارد. ها فاقد آنزیمی است که مواد موجود در کلم را کامل و سریع هضم کند. شوند، زیرا بدن آن برخی افراد با مصرف کلم و حبوبات دچار نفخ می‌ها، مواد شیمیایی شود. افزودنی‌ها سبب افزایش زمان ماندگاری و کیفیت مواد غذایی می‌های خاص به عنوان افزودنی استفاده از مواد شیمیایی با ویژگی شوند. دهنده هستند که به صورت هدفمند به مواد خوراکی یا غذاها افزوده می‌دهنده و طعم مانند نگهدارنده، رنگ گویند و آن را گیری را سرعت متوسط مصرف یا تولید آن ماده می‌سرعت مصرف با تولید یک ماده شرکت کننده در واکنش در گستره زمانی قابل اندازه دهد. را نشان میA سرعت متوسط تولید یا مصرف مادهR(A)دهند. از این را نمایش میRبا نماد دهند: های مربوط به آهنگ مصرف یا تولید مواد را نشان می‌موارد زیر فرمول n() n()R() R() tt ∆ ∆= −= ∆∆ شود از رابطه زیر، برای محاسبه سرعت متوسط انجام شده‌اند یک واکنش استفاده می n()n()R() tt ∆∆= += − توان سرعت متوسط مصرف یا تولید را افزون بر یکای مول بر زمان با یکای مول بر لیتر(غلظت) بر زمان نیز‌ها در فاز گاز و محلول، می‌برای شرکت کننده دهند. گزارش کرد. توجه داریم که غلظت مولی یک ماده را با نوشتن فرمول شیمیایی آن درون یک کروشه نمایش می‌های‌ها محتوی ترکیب‌ها و پیری زودرس دارند. این خوراکی‌های گوناگون، نقش بازدارندگی موثری در برابر سرطان برنامه غذایی محتوی سبزیجات و میوه‌ها دخالت دارند. ها و اندام‌هایی هستند که در حفظ سلامت بافت‌ها ترکیب‌ها هستند. ریزمغذی ای به نام ریز مغذی آلی سیرنشده‌ها به عنوان بازدارنده از انجام واکنش نامطلوب و ناخواسته به دلیل حضور‌ها هنوز به طور دقیق مشخص نشده است اما برخی از آن نقش کامل ریز مغذی کنند. به عنوان مثال، لیکوپن نوعی ریزمغذی است. ها جلوگیری می‌رادیکال تایی پیروی‌هایی است که از قاعده هشت رادیکال، گونه فعال و ناپایداری است که در ساختار خود، الکترون جفت نشده دارد. در واقع، این گونه محتوی اتم‌های آزاد هستند. ساختار مولکولی این دو‌هایی از رادیکال مث ده‌اند به معنی شکستن پیوندهای استری (پیوند بین اتم‌های کربن و اکسیژن در گروه عاملی استری) و سست شده‌اند تار و پود لباس است. لباس‌های دوخته شده با استفاده از پلی آمیدها نیز به طریق مشابه و با شکستن پیوندهای آمیدی(پیوند بین اتم‌های کربن و نیتروژن در گروه عاملی آمیدی) پوسیده می‌شوند. لباس‌های نخی در محیط‌های گرم و مرطوب زودتر پوسیده می‌شوند، چراکه این عوامل سرعت واکنش‌های مربوط به پوسیدگی را افزایش می‌دهند. استفاده بی رویه از شوینده‌ها در شستن لباس‌ها، سبب پوسیده شده‌اند سریع تر آن‌ها می‌شود، زیرا شوینده‌ها باعث افزایش سرعت واکنش آبکافت می‌شوند. همچنین اگر لباس‌ها را برای مدت طولانی در محلول آب و شوینده قرار بدهیم، بوی بد و نافذی پیدا می‌کنند. علت ایجاد بوی بد، تجزیه الیاف سازنده لباس‌ها به مواد ساده تر است. لباس‌های تهیه شده از پارچه‌های پلی استری یا پلی آمیدی برای مدت‌های طولانی قابل استفاده هستند، زیرا الیاف سازنده این لباس‌ها استحکام خود را برای مدت طولانی حفظ کرده و واکنش آبکافت این مواد بسیار کند است. هرچند پلی استرها و پلی آمیدها تجزیه می‌شوند، اما آهنگ تجزیه آن‌ها به ساختار مونومرهای سازنده بستگی دارد. بنابراین بسته به جنس لباس، زمان استفاده از لباس‌ها و مدت زمان ماندگاری آن‌ها متفاوت است. پلیمرهای حاصل از هیدروکربن‌های سیرنشده(مثل پلی اتن و پلی پروپن)، به انجام واکنش تمایلی ندارند و از این را پوشاک و پوشش‌های تهیه شده از این مواد در طبیعت تجزیه نمی‌شوند و برای سالیان طولانی دست نخورده باقی می‌مانند. در واقع پلیمرهای مورد نظر ماندگار هستند. علت این است که این پلیمرها، ساختاری شبیه به آلکان‌ها دارند و سیر شده هستند؛ در نتیجه تمایلی به انجام واکنش‌های شیمیایی ندارند. استفاده از پلیمرها ی ماندگار صرفه اقتصادی دارد، اما از نگاه پیشرفت پایدار، تولید و استفاده از این پلیمرها الگوی مصرف مطلوبی نیست. در واقع، ماندگاری دراز مدت مواد ساخته شده از این پلیمرها در طبیعت، سبب ایجاد مشکلات فراوانی مانند تبدیل محیط زیست به گورستان زباله، کثیف شده‌اند چهره شهرها و محیط زیست و آسیب زدن به زندگی جانداران می‌شود که هزینه‌های تحمیل شده به اقتصاد یک جامعه را خیلی بالا می‌برد. برای کاهش آلودگی ناشی از استفاده از پلیمرهای ماندگار، دو راهکار وجود دارد: جایگزینی پلیمرهای ساختگی با پایه ی نفتی با پلیمرهای زیست تخریب پذیر مثل: پلی پلی لاکتیک اسید بازیافت پلیمرهای استفاده شده 1 اند که بر روی‌هایی را در نظر گرفته‌های حاصل از بازیافت، برای هر پلیمر نشانه به منظور آسان سازی و افزایش کارایی بازیافت و افزایش کیفیت فراورده ای از این نمادها را نشان شود. این نشانه شامل عددی است که درون یک مثلث قرار دارد. تصویر زیر، نمونه کالاهای ساخته شده از آن پلیمر حک می‌شوند: دهد که بر روی کالاهای مختلف حک می‌می‌ها شوند. هرگاه این پلیمرها و کالاهای ساخته شده از آن بینی تجزیه می‌اند که توسط جانداران ذره ای از پلیمرها شده‌ها، موفق به ساخت دسته دان شیمی شوند. به همین دلیل به پلیمرهای دوستدار محیط اکسید تبدیل می‌های ساده مانند آب و کربن دی در طبیعت رها شوند، پس از چند ماه به مولکول زیست یا پلیمرهای سبز معروف هستند. کنند. مراحل تولید این پلیمرها به صورت زیر است: های کشاورزی مانند سیب زمینی، ذرت و نیشکر تهیه می‌پلیمرهای سبز را از فراورده‌های پلاستیکی یکبار مصرف مانند وسایل آشپزخانه، سفره، سطل زباله و کیسه پلاستیکی تولید شده و کاربرد لاکتیک اسید، انواع ظرف با استفاده از پلی گذارند. تری در محیط زیست برجای می‌ها امکان تبدیل شده‌اند به کود را داشته به همین دلیل، ردپای کوچک‌ها را به گسترش است. این پلاستیک آن توجه داریم که شیر ترش شده دارای لاکتیک اسید است. های نشاسته از مونومرهای گلوکز و از عناصر دانیم، مولکول شود. همانطور که می‌های تولید شده از پلیمرهای سبز، پلاستیک سبز گفته می‌به پلاستیک وجود دارند.OوH،Cهای سبز نیز عناصر توان گفت که در ساختار پلاستیک اند؛ پس می‌ساخته شدهOوH،C","page":79,"type":"محاسباتی","hasFormula":true,"keywords":["آمید","بازیافت","تراکمی","زیست تخریب","سلولز","مونومر"]},{"text":"لباس‌های پلی استری در اثر عوامل محیطی در طول زمان پوسیده می‌شوند. این پوسیده شده‌اند به معنی شکستن پیوندهای استری(پیوند بین اتم‌های کربن و اکسیژن در گروه عاملی استری و)سست شده‌اند تار و پود لباس است.لباس‌های دوخته شده با استفاده از پلی آمیدها نیز به طریق مشابه و با شکستن پیوندهای آمیدی(پیوند بین اتم‌های کربن و نیتروژن در گروه عاملی استری)پوسیده می‌شوند.","page":81,"type":"مفهومی","hasFormula":false,"keywords":["آمید","پلی استر"]},{"text":"لباس‌های نخی در محیط‌های گرم و مرطوب زودتر پوسی :","page":87,"type":"محاسباتی","hasFormula":true,"keywords":["صابون","پاک کننده"]},{"text":"پاک کننده‌های غیرصابونی از مواد پتروشیمیایی طی واکنش‌های پیچیده در صنعت تولید می‌شودن. این مواد قدرت پاک کنندگی بیشتری نسبت به صابون دارند و در آب‌های سخت خاصیت پاک کنندگی خود را حفظ می‌کنند؛زیرا با یون‌های موجود در این آب‌ها رسوب تشکیل نمی‌دهند.","page":87,"type":"مفهومی","hasFormula":false,"keywords":["رسوب","صابون","پاک کننده"]},{"text":"صابون طبیعی معروف به صابون مراغه با بیش از 150 سال قدمت، معروف ترین صابون سنتی ایران است. برای تهیه این صابون، پیه گوسفند و سود سوزآور را در دیگ‌های بزرگ با آب برای چندین ساعت می‌جوشانند و پس از قالب گیری آن‌ها را در آفتاب خشک می‌کنند.","page":87,"type":"حفظی","hasFormula":false,"keywords":["سوزآور","صابون"]},{"text":"صابون مراغه افزودنی شیمیایی ندارد و به دلیل خاصیت بازی مناسب،برای شست و شوی موهای چرب استفاده می‌شود.","page":87,"type":"مفهومی","hasFormula":false,"keywords":["افزودنی","باز","صابون"]},{"text":"سالانه حدود 200 تن صابون در شهر مراغه تولید می‌شود. صابون‌های سنتی در شهر‌هایی مانند آشتیان، رودبار و... نیز تولید می‌شوند.از نوعی صابون سنتی در تنور نان سنگک برای چرب کردن سطح سنگ‌ها استفاده می‌شود.","page":87,"type":"مفهومی","hasFormula":false,"keywords":["صابون"]},{"text":"امروزه صابون‌ها و شوینده‌های دیگری تولید می‌شوند که افزون بر خاصیت پاک کنندگی، خواص ویژه ای نیز دارند.این صابون‌ها، افزودنی‌های ویژه ای دارند. به طور مثال، 1- صابون گوگرددار برای از بین بردن جوش صورت و همچنین قارچ‌های پوستی استفاده می‌شود. 2- از صابون کلردار به منظور افزایش خاصیت ضدعفونی کنندگی و میکروب کشی استفاده می‌شود. 3- از افزودن نمک‌های فسفات(PO 4) به شوینده‌ها،برای جلوگیری از تشکیل رسوب و ایجاد لکه به واسطه ی واکنش صابون‌ها با یون کلسیم و منیزیم استفاده می‌شود.","page":87,"type":"مفهومی","hasFormula":true,"keywords":["افزودنی","رسوب","صابون","منیزیم","کلسیم"]},{"text":"نمودار زیر، نقش افزودنی‌های مختلف را در پاک کننده‌های صابونی نشان می‌دهد: پاک ‌کننده‌های‌صابونی مواد گوگردداراز بین بردن جوش صورت و قارچ‌های پوستی مواد کلردارافزایش خاصیت ضدعفونی کنندگی و م  از گسترش بیماری‌هایی از جمله وبا در جهان تولید پلاستیک تحول در صنعت پوشاک و صنعت بسته بندی (غذا، دارو و...) شناسایی و تولید مواد بی حس کننده و آنتی بیوتیک هموار کردن راه برای برای جراحی‌های گوناگون شناسایی و تولید کودهای شیمیایی مناسب تامین غذای جمعیت جهان تولید بنزین سرعت بخشیدن به حمل و نقل و کاهش آلودگی توسط مبدل‌های کاتالیستی","page":114,"type":"حفظی","hasFormula":false,"keywords":["آلودگی"]},{"text":"استفاده بهینه و درست از دانش و فناوری، آسایش و رفاه را در زندگی تامین می‌کند، اما استفاده نادرست از آن، آثار مخرب تر و زیانبارتری به دنبال خواهد داشت.برای نمونه تولید سلاح‌های شیمیایی استفاده نادرست از دانش و فناوری را نشان می‌دهد.","page":114,"type":"مفهومی","hasFormula":false,"keywords":[]},{"text":"در نمودار زیر، ترتیب زمانیتولید برخی از فناوری‌های شیمیایی در سال‌های پس از انقلاب صنعتی نشان داده شده است:","page":114,"type":"مفهومی","hasFormula":false,"keywords":[]},{"text":"تماشای آسمان آبی و تنفس در هوای پاک،همیشه لذت بخش و شادی آفرین است،اما گاهی در آسمان به ویژه در زمستان، شاهد لایه قهوه ای روشن هستیم که سطح شهرهای بزرگ جهان و کشورمان را می‌پوشاند. این لایه ی قهوه ای رنگ ناشی از وجود گاز NO2 در هواکره است","page":114,"type":"حفظی","hasFormula":false,"keywords":["هوای پاک"]},{"text":"هوای خشک و پاک مخلوطی از گازهای گوناگون است که به طور یکنواخت در هواکره پخش شده اند.گازهای نیتروژن، اکسیژن، کربن دی اکسید و آرگون، از جمله مواد موجود در هوای پاک و خشک هستند. این در حالی است که هوای آلوده افزون بر این گازها، حاوی گازهای گوناگونی مانند SO2 ، O3 ،NO2 ،CO،NOوذره‌های معلق و مواد آلی فرّار است.","page":114,"type":"مفهومی","hasFormula":false,"keywords":["هوای پاک"]},{"text":"به دلیل وجود آلاینده‌های مختلف،هوای آلوده بوی بدی دارد، چهره شهر را زشت می‌کند، فرسودگی ساختمان‌ها و پوسیدگی خودروها را سرعت می‌بخشد و سبب ایجاد و تشدید بیماری‌های تنفسی ازجمله برونشیت، آسم، سرطان ریه و حتی مرگ می‌شود. تولید کود شیمیایی)ابتدا آمونیاک و سپس اوره(مراقبت‌های بهداشتی)تولید ویتامین آ(پوشش دوستدار محیط)عایق‌های گرمایی(زیست دهد ای از هوای یک شهر بزرگ نشان می‌ها را در نمونه نمودار زیر، روند تغییر غلظت برخی از آلاینده در رابطه با نمودار داده شده، به مطالب زیر توجه کنید: از موتور خودروها خارج می‌شود، پس این گاز حدود ساعتNO در ابتدای صبح به دلیل فعالیت زیاد خودروها، گاز در شرایط دیگری مانند دمای بسیار بالا و یا رعد و برق، طی واکنش میان گازهای اکسیژن و نیتروژن نیز تولید می‌شود.NOالبته، گاز به حداکثر غلظت خود در شبانه 2NOکاهش یافته و حدود ساعتNO، غلظت گاز 222NO(g) O (g) 2NO (g)+→ با گذشت زمان، طبق واکنش روز می‌رسد. این گاز سبب ایجاد لایه ای قهوه ای در آسمان می‌شود که در زمستان، این رنگ با شدت بیش تری نمایان می‌شود. توجه داریم که حداکثر غلظت گاز در هواکره است.NO در هواکره، بیشتر از حداکثر غلظت گاز 2NO جزو رادیکال‌های آزاد هستند و باعث بیماری‌های تنفسی می‌شوند 2NOوNO گازهای (واکنش تولید اوزون تروپوسفری) تولید 22 3NO (g) O (g) NO(g) O (g)+ → از دیگر آلاینده‌های موجود در هوا است که به واسطه ی واکنش 3O گاز بیشتر ین غلظت در بین ساعات شبانه روز را دارد.3Oمی شود. در حوالی ساعت یک آلاینده سمی و خطرناک است؛ به طوری که حضور آن در هوای تنفسی سبب سوزش چشم‌ها و آسیب دیدن ریه می‌شود.3O گاز است. به عبارت دیگر، در طول شب 23NO NO O>> در طول شب غلظت هیچ کدام از آلاینده‌ها به صفر نمی‌رسد و ترتیب غلظت آن‌ها در طول شب به صورت فراوان ترین آلاینده موجود در هواکره است.2NOگاز هستند.xyCHوNO، 2SO،CO تعدادی از آلاینده‌هایی که در خروجی اگزوز خودروها وجود دارند، عبارت از آلاینده‌های خارج شده از اگزوز، در کسری از ثانیه از موتور خودرو خارج و وارد هواکره می‌شوند. علاوه بر این، دمای آن‌ها در این زمان بسیار کوتاه به سرعت کاهش می‌یابد. دلیل وجود هیدروکربن‌ها در اگزوز خودرو، این است که این هیدروکربن‌ها بسیار فرار بوده و قبل از واکنش با اکسیژن از اگزوز خارج شدند.، ماده ای بی رنگ و بی بو COاست. گازxyCO C H NO>> مقایسه مقدار چند مورد از آلاینده‌های تولید شده در اگزوز خودرو به ازای طی یک کیلومتر به صورت بوده و بسیار سمی است. ها و مقدار هریک از‌ها را تشخیص داد. همچنین نوع آلاینده توان به آسانی وجود آن رنگ هستند و نمی‌هایی است که اغلب بی هوای آلوده حاوی آلاینده کنش این مواد با را تشخیص دهیم، برهم‌ها توانیم نوع و غلظت آلاینده‌هایی که با توجه به آن می‌ها در شهرهای گوناگون متفاوت است. یکی از روش آن پر <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const app = document.getElementById('app');
const qEl = document.getElementById('q');
const clearEl = document.getElementById('clear');

const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const norm = s => (s||'')
  .replace(/[\u064B-\u0652\u200c\u200f\u200e]/g,'')
  .replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه')
  .replace(/[۰-۹]/g, d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
  .replace(/\s+/g,' ').trim().toLowerCase();

const state = { grade:'همه', type:'همه', chapter:null, q:'', done:new Set() };

const NOTES = [];
DATA.chapters.forEach(ch => ch.sections.forEach(sec => sec.notes.forEach((n,i) => {
  n.id = ch.id + '-' + norm(sec.title).slice(0,12).replace(/ /g,'_') + '-' + i;
  n.ch = ch; n.sec = sec;
  n.hay = norm([n.text, ch.title, sec.title, (n.keywords||[]).join(' ')].join(' '));
  NOTES.push(n);
})));

/* ---------- chips ---------- */
function chips(el, items, key, cls){
  el.innerHTML = items.map(v =>
    `<button class="chip ${cls}" data-k="${key}" data-v="${v}" aria-pressed="${state[key]===v}">${v}</button>`).join('');
}
chips(document.getElementById('gradechips'), ['همه','دهم','یازدهم','دوازدهم'], 'grade','');
chips(document.getElementById('typechips'), ['همه','مفهومی','حفظی','محاسباتی'], 'type','t');
document.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return;
  state[c.dataset.k] = c.dataset.v;
  chips(document.getElementById('gradechips'), ['همه','دهم','یازدهم','دوازدهم'],'grade','');
  chips(document.getElementById('typechips'), ['همه','مفهومی','حفظی','محاسباتی'],'type','t');
  render();
});

qEl.addEventListener('input', () => { state.q = qEl.value; clearEl.style.display = state.q ? 'block':'none'; render(); });
clearEl.addEventListener('click', () => { qEl.value=''; state.q=''; clearEl.style.display='none'; qEl.focus(); render(); });
document.addEventListener('keydown', e => {
  if((e.metaKey||e.ctrlKey) && e.key==='k'){ e.preventDefault(); qEl.focus(); qEl.select(); }
  if(e.key==='Escape' && document.activeElement===qEl){ qEl.blur(); }
});

/* ---------- helpers ---------- */
function highlight(text, terms){
  let html = escapeHtml(text);
  if(!terms.length) return html;
  terms.forEach(t => {
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').split('').join('[\\u200c]?') + ')','gi');
    html = html.replace(re, '<mark>$1</mark>');
  });
  return html;
}
function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function noteCard(n, terms, crumb){
  const cls = {'مفهومی':'mafhoomi','حفظی':'hefzi','محاسباتی':'mohasebati'}[n.type];
  const done = state.done.has(n.id);
  return `<article class="note ${done?'done':''}" data-id="${n.id}">
    ${crumb ? `<div class="crumb">شیمی ${n.ch.grade} · فصل ${fa(n.ch.number)} · <b>${escapeHtml(n.sec.title)}</b></div>`:''}
    <p>${highlight(n.text, terms)}</p>
    ${n.hasFormula ? `<span class="figure">این نکته در کتاب با شکل یا فرمول همراه است — صفحهٔ ${fa(n.page)} فایل اصلی</span>`:''}
    <div class="meta">
      <span class="tag ${cls}">${n.type}</span>
      <button class="mark-btn" data-mark="${n.id}" aria-pressed="${done}">${done?'خوانده شد':'علامت بزن'}</button>
      <span class="pg">ص ${fa(n.page)}</span>
    </div>
  </article>`;
}

app.addEventListener('click', e => {
  const m = e.target.closest('[data-mark]');
  if(m){ const id = m.dataset.mark; state.done.has(id) ? state.done.delete(id) : state.done.add(id); render(); return; }
  const c = e.target.closest('[data-ch]');
  if(c){ state.chapter = c.dataset.ch; window.scrollTo({top:0}); render(); return; }
  if(e.target.closest('#back')){ state.chapter = null; render(); }
});

/* «فصل ۲ دهم» را به فیلتر ساختاری تبدیل می‌کند، نه جست‌وجوی متنی */
function parseQuery(raw){
  let q = norm(raw);
  let grade = null, chapter = null;
  ['دوازدهم','یازدهم','دهم'].forEach(g => {
    if(!grade && q.includes(norm(g))){ grade = g; q = q.replace(norm(g),' '); }
  });
  const m = q.match(/فصل\s*(\d+)/);
  if(m){ chapter = parseInt(m[1],10); q = q.replace(m[0],' '); }
  q = q.replace(/\bشیمی\b/g,' ').replace(/\s+/g,' ').trim();
  return { grade, chapter, terms: q ? q.split(' ').filter(t=>t.length>1) : [] };
}

function match(n){
  if(state.grade!=='همه' && n.ch.grade!==state.grade) return false;
  if(state.type!=='همه' && n.type!==state.type) return false;
  return true;
}

/* ---------- views ---------- */
function renderIndex(){
  const pool = NOTES.filter(match);
  const byGrade = {};
  DATA.chapters.forEach(ch => {
    if(state.grade!=='همه' && ch.grade!==state.grade) return;
    const c = pool.filter(n => n.ch.id===ch.id).length;
    if(!c) return;
    (byGrade[ch.grade] = byGrade[ch.grade] || []).push([ch, c]);
  });
  const total = pool.length;
  const doneCount = pool.filter(n=>state.done.has(n.id)).length;
  return `
  <section class="hero">
    <h1>هرچی از شیمی کنکور لازم داری،<br>یک‌جا و مرتب.</h1>
    <p>۱۰ فصل کتاب دهم تا دوازدهم، خلاصه‌شده و دسته‌بندی‌شده بر اساس مبحث. می‌توانی مستقیم سراغ فصل بروی یا هر چیزی را در کل کتاب جست‌وجو کنی.</p>
    <div class="stats">
      <div><b>${fa(total)}</b>نکته</div>
      <div><b>${fa(Object.values(byGrade).flat().length)}</b>فصل</div>
      <div><b>${fa(doneCount)}</b>خوانده‌شده</div>
    </div>
    <div class="progressbar"><i style="width:${total?doneCount/total*100:0}%"></i></div>
  </section>
  <nav class="path">
    ${['دهم','یازدهم','دوازدهم'].filter(g=>byGrade[g]).map(g => `
      <div class="grade">
        <h2>شیمی ${g}</h2>
        <div class="chlist">
          ${byGrade[g].map(([ch,c]) => `
            <button class="chbtn" data-ch="${ch.id}">
              <span class="no">${fa(ch.number)}</span>
              <span class="ttl">${escapeHtml(ch.title)}</span>
              <span class="cnt">${fa(c)} نکته</span>
            </button>`).join('')}
        </div>
      </div>`).join('')}
  </nav>`;
}

function renderChapter(ch){
  const terms = state.q ? parseQuery(state.q).terms : [];
  const secs = ch.sections.map(sec => {
    const ns = sec.notes.filter(match).filter(n => !terms.length || terms.every(t => n.hay.includes(t)));
    return [sec, ns];
  }).filter(([,ns]) => ns.length);
  const shown = secs.reduce((a,[,ns])=>a+ns.length,0);
  return `
  <button class="back" id="back">→ همهٔ فصل‌ها</button>
  <div class="chhead">
    <div class="eyebrow">شیمی ${ch.grade} · فصل ${fa(ch.number)}</div>
    <h1>${escapeHtml(ch.title)}</h1>
  </div>
  ${ch.intro ? `<div class="intro"><b>این فصل چطور فصلی است؟</b> ${escapeHtml(ch.intro)}</div>`:''}
  ${shown ? secs.map(([sec, ns]) => `
    <section class="sec">
      <h3>${escapeHtml(sec.title)} <span class="seccnt">${fa(ns.length)} نکته</span></h3>
      <div class="notes">${ns.map(n=>noteCard(n, terms, false)).join('')}</div>
    </section>`).join('')
   : `<div class="empty"><b>در این فصل چیزی با این فیلترها پیدا نشد.</b>فیلتر نوع نکته را عوض کن یا جست‌وجو را پاک کن.</div>`}`;
}

function renderSearch(){
  const {grade, chapter, terms} = parseQuery(state.q);
  const res = NOTES.filter(match)
    .filter(n => !grade || n.ch.grade === grade)
    .filter(n => !chapter || n.ch.number === chapter)
    .filter(n => terms.every(t => n.hay.includes(t)));
  if(!res.length) return `<div class="empty"><b>چیزی پیدا نشد.</b>شاید املای کلمه فرق دارد — مثلاً «اوزون»، «پلیمر»، «سلول گالوانی» را امتحان کن.</div>`;
  const byCh = {};
  res.forEach(n => (byCh[n.ch.id] = byCh[n.ch.id]||[]).push(n));
  return `<div class="rescount">${fa(res.length)} نکته پیدا شد در ${fa(Object.keys(byCh).length)} فصل</div>` +
    Object.entries(byCh).map(([id, ns]) => {
      const ch = ns[0].ch;
      return `<section class="sec">
        <h3>${escapeHtml(ch.title)} <span class="seccnt">شیمی ${ch.grade} · فصل ${fa(ch.number)}</span></h3>
        <div class="notes">${ns.map(n=>noteCard(n, terms, true)).join('')}</div>
      </section>`;
    }).join('');
}

function render(){
  const pq = parseQuery(state.q);
  if(state.q.trim().length > 1 && !state.chapter && (pq.terms.length || pq.grade || pq.chapter)) app.innerHTML = renderSearch();
  else if(state.chapter) app.innerHTML = renderChapter(DATA.chapters.find(c=>c.id===state.chapter));
  else app.innerHTML = renderIndex();
}
render();
</script>
</body>
</html>
