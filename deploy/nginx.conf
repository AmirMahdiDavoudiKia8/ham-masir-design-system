# Nginx reverse proxy for HamMasir (hammasirsite.ir)
# Path on server: /etc/nginx/sites-available/hammasirsite.ir
# Enable with:    ln -s /etc/nginx/sites-available/hammasirsite.ir /etc/nginx/sites-enabled/
#
# Assumes /var/www/hammasir/current is a symlink to the live release —
# see deploy/README.md for the full directory layout and deploy steps.

# Plain HTTP: redirect everything to HTTPS once certbot has issued a cert.
# Before the first `certbot --nginx` run, comment out the redirect line and
# let certbot's ACME challenge hit this block directly.
server {
    listen 80;
    listen [::]:80;
    server_name hammasirsite.ir www.hammasirsite.ir;

    # Domain-verification files (eNamad, etc.) must be reachable over plain
    # HTTP too — some verifier bots don't follow the 301 to HTTPS below.
    location ~* ^/[0-9]+\.txt$ {
        root /var/www/hammasir/current/public;
    }

    # Redirect to the APEX host explicitly, not $host: with $host, an
    # http://www request stayed on www all the way through and only reached
    # the canonical domain via a second hop (or not at all).
    location / {
        return 301 https://hammasirsite.ir$request_uri;
    }
}

# www over HTTPS: its own block that does nothing but redirect to the apex.
# Previously `www.hammasirsite.ir` shared server_name with the apex here, so
# the entire site was served twice under two hostnames, both returning 200 —
# two crawlable copies of every page. The rel=canonical tags pointed at the
# apex, but a canonical is a hint Google may ignore; a 301 is not.
# The Let's Encrypt cert already covers both names (SAN: hammasirsite.ir,
# www.hammasirsite.ir), so this needs no certificate change.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hammasirsite.ir;

    ssl_certificate     /etc/letsencrypt/live/hammasirsite.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hammasirsite.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS must be sent on the redirect itself, or a browser arriving at
    # www for the first time never records the policy.
    include /etc/nginx/snippets/hammasir-security-headers.conf;

    return 301 https://hammasirsite.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hammasirsite.ir;

    # Don't advertise the exact nginx version in every response — it was
    # answering "nginx/1.18.0 (Ubuntu)", which hands anyone scanning for
    # known 1.18.0 issues a free confirmation.
    server_tokens off;

    include /etc/nginx/snippets/hammasir-security-headers.conf;

    # Written by `certbot --nginx` on the first run — left here as-is so
    # reapplying this file doesn't lose certbot's own recommended TLS options.
    ssl_certificate     /etc/letsencrypt/live/hammasirsite.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hammasirsite.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m; # mentor photo/voice uploads from the portal

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Next.js build output is content-hashed and immutable — safe to cache
    # forever. Served straight by Nginx, never touches the single Node core.
    # `^~` forces this prefix match to win over the regex extension-match
    # location below — without it, nginx's regex-beats-prefix precedence
    # sends self-hosted font files (.woff2, matched by that block's
    # extension list too) to the `public/` root instead, 404ing every font
    # on every page (confirmed: this was live and broken).
    location ^~ /_next/static/ {
        alias /var/www/hammasir/current/.next/static/;
        # Re-included because this location declares its own add_header, which
        # cancels inheritance of every server-level one (see the snippet's
        # header comment).
        include /etc/nginx/snippets/hammasir-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Exact match beats both the `^~` prefix above and the regex extension
    # block below in nginx's precedence order — needed because /robots.txt
    # is generated dynamically by src/app/robots.ts, not a static file under
    # public/, but its `.txt` extension would otherwise fall into the next
    # block's try_files and 404 before ever reaching Node (confirmed: this
    # was live and broken).
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # Everything under public/ served by file extension — mentor photos/
    # voices, university logos, brand assets, the library HTML. Matched
    # before the catch-all so these never reach Node. current/public/mentors
    # is a symlink into the persistent uploads dir (see deploy/README.md),
    # so uploaded photos/voices are covered by this same rule too.
    #
    # This list must cover EVERY extension the portal's upload actions can
    # produce (see PHOTO_TYPES/VOICE_TYPES in
    # app/mentor/portal/profile/actions.ts) — anything missing falls through
    # to Node, which never serves files written to public/ after the server
    # started, so the upload "succeeds" and then 404s forever. `wav`/`weba`/
    # `webm` were missing for real: a mentor recording a voice intro in a
    # desktop browser (webm) or as a wav got a silently broken profile.
    location ~* \.(?:jpg|jpeg|png|gif|svg|webp|avif|ico|mp3|m4a|ogg|wav|weba|webm|woff2?|ttf|html|txt)$ {
        root /var/www/hammasir/current/public;
        # Same inheritance trap as above — and it matters most here, since this
        # block serves mentor-uploaded files, where nosniff does real work.
        include /etc/nginx/snippets/hammasir-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Everything else (pages, /api/*) goes straight to Node — no
    # Cache-Control override here, since these responses can be
    # session-specific; each route already sets its own caching (see the
    # `revalidate` values in `next build`'s route summary) where it's safe to.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
