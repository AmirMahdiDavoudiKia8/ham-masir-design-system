# Security response headers for hammasirsite.ir.
# Path on server: /etc/nginx/snippets/hammasir-security-headers.conf
#
# WHY THIS IS A SEPARATE FILE, INCLUDED IN EVERY LOCATION:
# nginx's add_header inherits from the parent level ONLY IF the current level
# declares no add_header of its own. Two locations in nginx.conf set their own
# `add_header Cache-Control`, which would silently drop every header below for
# static assets and the whole public/ tree. Including this snippet in each of
# those locations is what stops that — do not "simplify" it back to a single
# server-level block.
#
# `always` makes each header apply to error responses too (4xx/5xx), not just
# 2xx/3xx.

# Force HTTPS for a year. includeSubDomains is safe here and was verified
# before enabling: the only two vhosts on this box are hammasirsite.ir and
# portfolio.hammasirsite.ir, and portfolio serves HTTPS (200). Any NEW
# subdomain must therefore be HTTPS from day one or browsers will refuse it.
# Deliberately no `preload`: that ships the domain into a browser-baked list
# and is effectively irreversible, so it needs a conscious decision, not a
# side effect of this change.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Stop browsers guessing a MIME type different from what we send — the
# mechanism behind "uploaded image executes as script" attacks, which matters
# because mentors upload files into public/.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking: nothing here is meant to be embedded in a third-party frame.
add_header X-Frame-Options "SAMEORIGIN" always;

# Send the full URL only to ourselves; cross-origin gets the bare origin. Keeps
# student-identifying paths out of other sites' referer logs.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing on the site uses these APIs — verified: no getUserMedia/MediaRecorder
# anywhere in src/ (mentors upload voice files, they don't record in-browser).
# If in-browser recording is ever added, microphone=(self) is the change.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# CSP tuned to what this app actually loads, and no tighter.
#
# script-src keeps 'unsafe-inline'/'unsafe-eval' because Next.js inlines its
# own hydration bootstrap and the JSON-LD blocks; removing them would need
# per-request nonces through the whole app. That does blunt CSP's XSS
# protection — the real value retained here is the rest: frame-ancestors
# (clickjacking), base-uri (base-tag injection), form-action (form hijacking
# to an attacker's endpoint, which matters on a site that collects phone
# numbers and passwords) and object-src 'none'.
#
# cdn.kavenegar.com is the push-notification SDK loaded in app/layout.tsx;
# worker-src 'self' covers the service worker it registers at /kvn-push-sw.js.
# blob: in img-src/media-src covers client-side previews of uploads.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.kavenegar.com https://*.kavenegar.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.kavenegar.com; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://*.kavenegar.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
