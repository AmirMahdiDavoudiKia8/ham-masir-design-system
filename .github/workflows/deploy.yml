# Builds every push to the default branch and puts it on the VPS, following
# exactly the steps in deploy/README.md — including the two that have silently
# broken this site before: the persistent-data symlinks (link-persistent.sh,
# verified before anything goes live) and `pm2 delete` + `start` rather than
# `startOrReload`, which keeps serving the OLD release directory.
#
# The build runs here, not on the VPS: `next build` can OOM that 2GB box.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST         45.159.149.67
#   VPS_USER         root
#   VPS_SSH_KEY      the PRIVATE key whose public half is in the VPS's
#                    ~/.ssh/authorized_keys (locally: ~/.ssh/hammasir_vps)
#   VPS_KNOWN_HOSTS  output of: ssh-keyscan 45.159.149.67
#
# Deploys are serialised (concurrency below) so two pushes can never swap the
# `current` symlink at the same time.

name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch: # lets you redeploy the current code from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Same command as a local release: it runs check:persistent first, so a
      # new runtime-written path that isn't in deploy/persistent-manifest.txt
      # fails here instead of quietly resetting real data on the server.
      - run: npm run build

      - name: Package the release
        run: |
          set -euo pipefail
          mkdir -p release/deploy
          cp -r .next/standalone/. release/
          cp -r .next/static release/.next/static
          cp -r public release/public
          cp deploy/ecosystem.config.js release/
          cp deploy/persistent-manifest.txt deploy/link-persistent.sh deploy/verify-persistent.sh release/deploy/
          tar -czf release.tgz -C release .
          echo "RELEASE=$(date +%Y-%m-%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: scp -i ~/.ssh/deploy_key release.tgz "$VPS:/tmp/$RELEASE.tgz"

      - name: Install and switch the site over
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS" bash -s <<EOF
            set -euo pipefail
            DIR=/var/www/hammasir/releases/$RELEASE
            mkdir -p "\$DIR"
            tar -xzf /tmp/$RELEASE.tgz -C "\$DIR"
            rm -f /tmp/$RELEASE.tgz

            cd "\$DIR"
            # Exits non-zero if any persistent path is missing or mis-linked,
            # and \`set -e\` stops here — with \`current\` still pointing at the
            # previous release, so the site keeps serving the old version
            # rather than writing real data into the release directory.
            bash deploy/link-persistent.sh "\$DIR"

            ln -sfn "\$DIR" /var/www/hammasir/current
            cd /var/www/hammasir/current
            pm2 delete hammasir || true
            pm2 start ecosystem.config.js
            pm2 save
            sleep 5
            bash deploy/verify-persistent.sh /var/www/hammasir/current

            # Keep the five most recent releases so a rollback is always one
            # symlink away; older ones are just disk.
            cd /var/www/hammasir/releases
            ls -1t | tail -n +6 | xargs -r rm -rf
          EOF

      - name: Check the live site
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://hammasirsite.ir/student/home || true)
            [ "$code" = "200" ] && echo "live: $code" && exit 0
            sleep 5
          done
          echo "site did not return 200 after the deploy (last: $code)"
          exit 1
