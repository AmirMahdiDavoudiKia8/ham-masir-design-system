# Deploys to Cloudflare Workers (OpenNext) on every push to the default
# branch. Separate from deploy.yml (VPS) so the two platforms can be run
# side-by-side during migration, or either disabled alone.
#
# Required repository secret (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   API token with: Account -> Workers Scripts:Edit,
#                          Workers KV:Edit, D1:Edit, Account Settings:Read
#                          (Zone -> Workers Routes:Edit if routes change)
#   CLOUDFLARE_ACCOUNT_ID  0dea2fb9099f1350eb0ca9c5f944beea
#
# wrangler.jsonc already pins account_id; the token is still required for auth.

name: Deploy Cloudflare

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # cf:build runs the persistent-coverage gate, sets CF_RUNTIME=1
      # (security headers), and produces .open-next/worker + assets.
      - run: npm run cf:build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      - name: Health check
        run: npm run cf:health
